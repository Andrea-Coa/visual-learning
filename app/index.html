<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Learning</title>
  <meta name="description" content="How a neural network learns: hidden-layer representations across epochs and layers (MNIST, SVHN, CIFAR-10).">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/d3.v7.9.0.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Layout and panels follow VIS_PLAN.md §2. Panel bodies are filled by the modules in js/. -->
  <div class="layout">

    <aside class="column column-left">
      <header class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="7" cy="9" r="3"/><circle cx="7" cy="23" r="3"/>
          <circle cx="16" cy="16" r="3"/><circle cx="25" cy="9" r="3"/><circle cx="25" cy="23" r="3"/>
          <path d="M7 9 16 16 7 23M25 9 16 16 25 23"/>
        </svg>
        <h1>Visual<br>Learning</h1>
      </header>

      <section class="panel" id="controls-panel">
        <h2 class="panel-title">Controls</h2>
        <div class="panel-body" id="controls"></div>
      </section>

      <section class="panel" id="architecture-panel">
        <h2 class="panel-title">Architecture <span class="panel-subtitle" id="architecture-model"></span>
          <span class="panel-tools" id="architecture-tools"></span></h2>
        <div class="panel-body" id="architecture"></div>
      </section>

      <section class="panel" id="curve-panel">
        <h2 class="panel-title">Learning curve <span class="panel-tools" id="curve-tools"></span></h2>
        <div class="panel-body" id="learning-curve"></div>
      </section>
    </aside>

    <main class="column column-center">
      <section class="panel panel-embeddings" id="embeddings-panel">
        <h2 class="panel-title">
          Embeddings view
          <span class="panel-subtitle" id="embeddings-title"></span>
          <span class="panel-tools" id="embeddings-tools"></span>
        </h2>
        <div class="panel-body embeddings-body">
          <div class="plot" id="plot"></div>
          <!-- draft-v2: Layer / Epoch rows inside the plot, bottom-right -->
          <div class="steppers" id="steppers"></div>
        </div>
      </section>

      <section class="panel panel-images" id="images-panel">
        <h2 class="panel-title">Image view <span class="panel-subtitle" id="images-source"></span>
          <span class="panel-tools" id="images-tools"></span></h2>
        <div class="panel-body" id="images"></div>
      </section>
    </main>

    <aside class="column column-right">
      <section class="panel collapsible" id="metrics-panel">
        <h2 class="panel-title"><button type="button" class="collapse-btn" aria-expanded="true">Model metrics</button></h2>
        <div class="panel-body" id="metrics"></div>
      </section>

      <section class="panel collapsible" id="datapoint-panel">
        <h2 class="panel-title"><button type="button" class="collapse-btn" aria-expanded="true">Data point</button></h2>
        <div class="panel-body" id="datapoint"></div>
      </section>
    </aside>

  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
